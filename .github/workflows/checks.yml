name: SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate models and catalog
        run: go generate .
      - name: Verify SDK and catalog evidence
        run: python3 scripts/verify_catalog.py
      - name: Verify local installer and profile storage
        run: |
          bash -n install.sh scripts/setup-profile.sh
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Check generated artifacts
        run: git diff --exit-code
